# =========================================================
# VillagerControl - Configuration
# Compatible with Paper 26.1.x
# =========================================================
# After any change, run: /vc reload
# Color codes supported in messages: &a &c &e &b &d &r etc.
# =========================================================

# -----------------------------------------------
# VILLAGERS
# -----------------------------------------------
villagers:
  enabled: true   # Master switch. If false, applies spawn-control rules below.

  # Which spawn causes are blocked when enabled is false.
  # Set each to true to block that specific cause.
  spawn-control:
    natural: true       # Block natural spawning (world generation, village spawning)
    summoned: true      # Block /summon command and spawn eggs
    zombie-cure: true   # Block curing a zombie villager back into a villager

  # Control villager trading.
  # Only relevant if villagers.enabled is true.
  trades:
    enabled: true

  # Profession filter - only works when villagers.enabled is true.
  # It runs when a villager tries to take a job at a workstation.
  # A forbidden profession is simply not taken: the villager stays unemployed.
  # mode: blacklist -> listed professions are FORBIDDEN
  # mode: whitelist -> ONLY listed professions are ALLOWED (all others are forbidden)
  # Valid professions: ARMORER, BUTCHER, CARTOGRAPHER, CLERIC, FARMER, FISHERMAN,
  #   FLETCHER, LEATHERWORKER, LIBRARIAN, MASON, SHEPHERD, TOOLSMITH, WEAPONSMITH
  # (NONE and NITWIT are accepted but have no effect, they are never taken at a workstation.)
  professions:
    mode: blacklist
    list:
      - NONE
      - NITWIT

  # Worlds where this section's rules do NOT apply (exceptions).
  # Leave empty to apply rules in all worlds.
  excluded-worlds:
    - world_the_end

# -----------------------------------------------
# WANDERING TRADERS
# -----------------------------------------------
wandering-trader:
  enabled: true

  spawn-control:
    natural: true     # Block their scheduled natural spawning
    summoned: true    # Block /summon and spawn eggs

  trades:
    enabled: true

  excluded-worlds:
    - world_the_end

# -----------------------------------------------
# TRADER LLAMAS
# -----------------------------------------------
trader-llama:
  enabled: true

  spawn-control:
    natural: true     # Llamas spawn together with the wandering trader
    summoned: true    # Block /summon and spawn eggs

  excluded-worlds:
    - world_the_end

# -----------------------------------------------
# MESSAGES
# Use '' to disable a message entirely.
# Supports & color codes.
# -----------------------------------------------
messages:
  trade-blocked: "&cTrading is disabled on this server."
  zombie-cure-blocked: "&cZombie villager curing is disabled here."
  # Shown to nearby players only when a blocked mob is spawned with
  # /summon or a spawn egg. Natural spawns are blocked silently.
  spawn-blocked: "&cThat mob is disabled on this server."
